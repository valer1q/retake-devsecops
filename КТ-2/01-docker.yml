---
- name: Установка Docker
  hosts: DOCKER
  become: yes

  vars:
    default_container_image: ubuntu
    default_container_command: sleep infinity

  tasks:

    - name: Установить необходимые пакеты
      apt:
        name:
          - ca-certificates
          - curl
          - python3-docker
        state: present
        update_cache: yes

    - name: Создать каталог /etc/apt/keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Скачать GPG-ключ Docker
      get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        timeout: 120

    - name: Добавить репозиторий Docker
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Установить Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Запустить Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Скачать образ ubuntu
      community.docker.docker_image:
        name: "{{ default_container_image }}"
        source: pull

    - name: Запустить контейнер docker1
      community.docker.docker_container:
        name: docker1
        image: "{{ default_container_image }}"
        command: "{{ default_container_command }}"
        state: started

    - name: Запустить контейнер docker2
      community.docker.docker_container:
        name: docker2
        image: "{{ default_container_image }}"
        command: "{{ default_container_command }}"
        state: started
