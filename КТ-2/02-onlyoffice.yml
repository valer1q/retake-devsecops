---
- name: Установка ONLYOFFICE Workspace
  hosts: DOCKER
  become: yes

  tasks:

    - name: Установить curl и wget
      apt:
        name:
          - curl
          - wget
        state: present
        update_cache: yes

    - name: Скачать скрипт workspace-install.sh
      get_url:
        url: https://download.onlyoffice.com/install/workspace-install.sh
        dest: /root/workspace-install.sh
        mode: '0755'
        timeout: 120

    - name: Запустить установку ONLYOFFICE Workspace
      shell: echo Y | bash /root/workspace-install.sh -ims false -skiphc true
      args:
        chdir: /root
        creates: /root/onlyoffice-installed.txt
      async: 3600
      poll: 30

    - name: Создать файл-метку об успешной установке
      copy:
        content: "ONLYOFFICE Workspace installed without Mail Server\n"
        dest: /root/onlyoffice-installed.txt
        mode: '0644'

    - name: Дождаться запуска портала на порту 80
      wait_for:
        port: 80
        timeout: 600

    - name: Получить список контейнеров
      command: docker ps
      register: containers

    - name: Показать список контейнеров
      debug:
        var: containers.stdout_lines
