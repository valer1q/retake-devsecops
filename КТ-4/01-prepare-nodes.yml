---
- name: Подготовка нод кластера
  hosts: K8S
  become: yes

  tasks:

    - name: Установить wget, curl, bridge-utils и conntrack
      apt:
        name:
          - wget
          - curl
          - ca-certificates
          - bridge-utils
          - conntrack
        state: present
        update_cache: yes

    - name: Прописать имя хоста в /etc/hosts
      lineinfile:
        path: /etc/hosts
        line: "127.0.1.1 {{ inventory_hostname }}"

    - name: Задать имя хоста
      hostname:
        name: "{{ inventory_hostname }}"

    - name: Скачать скрипт установки Docker
      get_url:
        url: https://get.docker.com
        dest: /root/get-docker.sh
        mode: '0755'
        timeout: 120

    - name: Установить Docker
      command: sh /root/get-docker.sh
      args:
        creates: /usr/bin/docker

    - name: Запустить Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Отключить swap
      command: swapoff -a

    - name: Отключить swap после перезагрузки
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Загрузить модуль ядра overlay
      community.general.modprobe:
        name: overlay
        state: present

    - name: Загрузить модуль ядра br_netfilter
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Загружать модули при старте системы
      copy:
        content: |
          overlay
          br_netfilter
        dest: /etc/modules-load.d/k8s.conf
        mode: '0644'

    - name: Включить net.bridge.bridge-nf-call-iptables
      ansible.posix.sysctl:
        name: net.bridge.bridge-nf-call-iptables
        value: '1'
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: yes

    - name: Включить net.bridge.bridge-nf-call-ip6tables
      ansible.posix.sysctl:
        name: net.bridge.bridge-nf-call-ip6tables
        value: '1'
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: yes

    - name: Включить net.ipv4.ip_forward
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: yes

    - name: Создать стандартный конфиг containerd
      shell: containerd config default > /etc/containerd/config.toml

    - name: Включить SystemdCgroup в containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Перезапустить containerd
      service:
        name: containerd
        state: restarted
        enabled: yes
