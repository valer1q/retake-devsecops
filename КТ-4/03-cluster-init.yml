---
- name: Создание кластера на мастер-ноде
  hosts: MASTER
  become: yes

  vars:
    pod_network: 172.16.0.0/16
    service_network: 192.168.3.0/24

  tasks:

    - name: Инициализировать кластер (kubeadm init)
      command: kubeadm init --pod-network-cidr={{ pod_network }} --service-cidr={{ service_network }}
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Создать каталог /root/.kube
      file:
        path: /root/.kube
        state: directory
        mode: '0700'

    - name: Скопировать конфиг kubectl для root
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes
        mode: '0600'

    - name: Создать каталог .kube у пользователя
      file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0700'

    - name: Скопировать конфиг kubectl для пользователя
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Скачать манифест flannel
      get_url:
        url: https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
        dest: /root/kube-flannel.yml
        mode: '0644'
        timeout: 120

    - name: Указать подсеть flannel
      replace:
        path: /root/kube-flannel.yml
        regexp: '10\.244\.0\.0/16'
        replace: "{{ pod_network }}"

    - name: Установить сеть flannel
      command: kubectl apply -f /root/kube-flannel.yml

    - name: Разрешить запуск подов на мастере
      command: kubectl taint nodes {{ inventory_hostname }} node-role.kubernetes.io/control-plane-
      failed_when: false

    - name: Получить команду kubeadm join
      command: kubeadm token create --print-join-command
      register: join_command

- name: Подключение рабочих нод к кластеру
  hosts: WORKERS
  become: yes

  tasks:

    - name: Подключить ноду к кластеру (kubeadm join)
      command: "{{ hostvars['k8s-master'].join_command.stdout }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

- name: Проверка кластера
  hosts: MASTER
  become: yes

  tasks:

    - name: Дождаться готовности всех нод
      command: kubectl wait --for=condition=Ready nodes --all --timeout=300s

    - name: Получить список нод
      command: kubectl get nodes -o wide
      register: nodes

    - name: Показать список нод
      debug:
        var: nodes.stdout_lines

    - name: Получить список сервисов
      command: kubectl get services
      register: services

    - name: Показать список сервисов
      debug:
        var: services.stdout_lines
