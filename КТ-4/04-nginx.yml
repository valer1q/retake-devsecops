---
- name: Запуск nginx в кластере Kubernetes
  hosts: MASTER
  become: yes

  tasks:

    - name: Скопировать манифест Replication Controller
      copy:
        src: files/nginx-rc.yml
        dest: /root/nginx-rc.yml
        mode: '0644'

    - name: Скопировать манифест сервисов
      copy:
        src: files/nginx-services.yml
        dest: /root/nginx-services.yml
        mode: '0644'

    - name: Создать Replication Controller nginx
      command: kubectl apply -f /root/nginx-rc.yml

    - name: Создать сервисы nginx-http и nginx-https
      command: kubectl apply -f /root/nginx-services.yml

    - name: Подождать создания подов
      pause:
        seconds: 10

    - name: Дождаться запуска подов nginx
      command: kubectl wait --for=condition=Ready pods -l run-container=nginx --timeout=300s

    - name: Получить список подов и контроллеров
      command: kubectl get pods,rc -o wide
      register: pods

    - name: Показать список подов и контроллеров
      debug:
        var: pods.stdout_lines

    - name: Получить список контроллеров и сервисов
      command: kubectl get rc,services
      register: services

    - name: Показать список контроллеров и сервисов
      debug:
        var: services.stdout_lines

    - name: Получить IP-адрес сервиса nginx-http
      command: kubectl get service nginx-http -o jsonpath={.spec.clusterIP}
      register: nginx_ip

    - name: Обратиться к сервису nginx-http
      shell: curl -s http://{{ nginx_ip.stdout }} | grep "<title>"
      register: nginx_page

    - name: Показать заголовок страницы nginx
      debug:
        var: nginx_page.stdout
