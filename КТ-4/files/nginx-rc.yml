apiVersion: v1
kind: ReplicationController
metadata:
  name: nginx
spec:
  replicas: 6
  selector:
    run-container: nginx
  template:
    metadata:
      labels:
        run-container: nginx
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
            - containerPort: 443
