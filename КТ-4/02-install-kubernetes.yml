---
- name: Установка Kubernetes
  hosts: K8S
  become: yes

  vars:
    k8s_version: v1.36

  tasks:

    - name: Создать каталог /etc/apt/keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Скачать ключ репозитория Kubernetes
      get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: '0644'
        timeout: 120

    - name: Добавить репозиторий Kubernetes
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/ /"
        filename: kubernetes
        state: present

    - name: Установить kubelet, kubeadm и kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes

    - name: Зафиксировать версию kubelet
      dpkg_selections:
        name: kubelet
        selection: hold

    - name: Зафиксировать версию kubeadm
      dpkg_selections:
        name: kubeadm
        selection: hold

    - name: Зафиксировать версию kubectl
      dpkg_selections:
        name: kubectl
        selection: hold

    - name: Включить автозапуск kubelet
      service:
        name: kubelet
        enabled: yes
