# Меняем строку в index.html через lineinfile.
- name: Replace text in index
  hosts: web
  become: true
  tasks:
    # Заменяем заголовок страницы.
    - name: Replace heading
      ansible.builtin.lineinfile:
        path: /var/www/html/index.html
        regexp: '^<h1>.*</h1>$'
        line: '<h1>DevSecOps server</h1>'
        create: true
        mode: '0644'
