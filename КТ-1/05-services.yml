---
# Сценарий 5. Управление службами: остановка, запуск, перезапуск
# Запуск: ansible-playbook 05-services.yml
# Перед запуском должен быть выполнен сценарий 1 (нужна служба nginx)

- name: Управление службой nginx
  hosts: NGINX
  become: yes

  tasks:

    # Останавливаем службу
    - name: Остановить nginx
      service:
        name: nginx
        state: stopped

    # Запускаем службу
    - name: Запустить nginx
      service:
        name: nginx
        state: started

    # Перезапускаем службу (остановка и запуск)
    - name: Перезапустить nginx
      service:
        name: nginx
        state: restarted

    # Перечитываем конфигурацию без остановки службы
    - name: Перечитать конфигурацию nginx
      service:
        name: nginx
        state: reloaded

    # Включаем автозапуск службы при загрузке системы
    - name: Включить автозапуск nginx
      service:
        name: nginx
        enabled: yes

    # Узнаём текущее состояние службы и сохраняем результат в переменную
    - name: Получить статус nginx
      command: systemctl is-active nginx
      register: nginx_status

    # Выводим статус на экран (должно быть active)
    - name: Показать статус nginx
      debug:
        var: nginx_status.stdout
