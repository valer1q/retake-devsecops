---
# Сценарий 2. Управление пользователями и их правами
# Запуск: ansible-playbook 02-user.yml

- name: Добавление пользователя newadmin
  hosts: DEVELOP
  become: yes

  tasks:

    # Создаём пользователя newadmin и добавляем его в группу sudo.
    # Группа sudo даёт право выполнять команды от имени root.
    # append: yes - добавить в группу, не удаляя из других групп.
    - name: Создать пользователя newadmin
      user:
        name: newadmin
        comment: New administrator
        shell: /bin/bash
        groups: sudo
        append: yes
        create_home: yes
        # Пароль 123 в виде хеша SHA-512 (модуль user принимает только хеш).
        # Такой хеш можно получить командой: openssl passwd -6 123
        password: '$6$i6EHURADzsegi8BI$pTI7dnu2D3jlK6M7s9gx.5AhtAHcRs3KhFqP1dVk3dHz./roi1BSYBKooATGmhogGJYKAk6iEUpMJCQU3WZ6k/'

    # Домашний каталог доступен только самому пользователю (rwx------)
    - name: Закрыть домашний каталог от других пользователей
      file:
        path: /home/newadmin
        state: directory
        owner: newadmin
        group: newadmin
        mode: '0700'
