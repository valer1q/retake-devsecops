---
# Сценарий 3. Обновление системы и перезагрузка сервера
# Запуск: ansible-playbook 03-update.yml

- name: Обновление всех пакетов и перезагрузка
  hosts: DEVELOP
  become: yes

  tasks:

    # Обновляем список пакетов и все установленные пакеты
    # (то же самое, что apt update и apt full-upgrade)
    - name: Обновить все пакеты
      apt:
        update_cache: yes
        upgrade: dist

    # Удаляем пакеты, которые больше не нужны
    - name: Удалить ненужные пакеты
      apt:
        autoremove: yes

    # Перезагружаем сервер и ждём, пока он снова станет доступен по SSH
    - name: Перезагрузить сервер
      reboot:
        reboot_timeout: 600
