# Сохраняем выбранные конфигурационные файлы.
- name: Backup configuration
  hosts: all
  become: true
  vars:
    backup_dir: /var/backups/configuration
    config_files:
      - /etc/hosts
      - /etc/ssh/sshd_config
  tasks:
    # Создаём защищённый каталог резервных копий.
    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
    # Копируем файлы конфигурации на целевой сервер.
    - name: Copy configuration files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ backup_dir }}/{{ item | basename }}"
        remote_src: true
        owner: root
        group: root
        mode: preserve
      loop: "{{ config_files }}"
    # Создаём архив резервных копий.
    - name: Archive backup
      community.general.archive:
        path: "{{ backup_dir }}"
        dest: "{{ backup_dir }}.tar.gz"
        format: gz
