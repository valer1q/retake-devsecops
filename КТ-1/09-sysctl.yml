---
# Сценарий 9 (второй в задании). Настройка системных параметров ядра через sysctl
# Запуск: ansible-playbook 09-sysctl.yml
# Модуль sysctl входит в коллекцию ansible.posix
# Все параметры записываются в файл /etc/sysctl.d/99-ansible.conf,
# поэтому сохраняются после перезагрузки.

- name: Настройка параметров sysctl
  hosts: DEVELOP
  become: yes

  tasks:

    # Ядро будет реже выгружать память в swap (по умолчанию 60)
    - name: Установить vm.swappiness = 10
      ansible.posix.sysctl:
        name: vm.swappiness
        value: '10'
        sysctl_file: /etc/sysctl.d/99-ansible.conf
        reload: yes

    # Защита от SYN-flood атак
    - name: Включить net.ipv4.tcp_syncookies
      ansible.posix.sysctl:
        name: net.ipv4.tcp_syncookies
        value: '1'
        sysctl_file: /etc/sysctl.d/99-ansible.conf
        reload: yes

    # Не принимать ICMP redirect, чтобы нельзя было подменить маршруты
    - name: Отключить net.ipv4.conf.all.accept_redirects
      ansible.posix.sysctl:
        name: net.ipv4.conf.all.accept_redirects
        value: '0'
        sysctl_file: /etc/sysctl.d/99-ansible.conf
        reload: yes

    # Записывать в журнал пакеты с невозможными адресами
    - name: Включить net.ipv4.conf.all.log_martians
      ansible.posix.sysctl:
        name: net.ipv4.conf.all.log_martians
        value: '1'
        sysctl_file: /etc/sysctl.d/99-ansible.conf
        reload: yes
