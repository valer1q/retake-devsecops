# Устанавливаем PostgreSQL и запускаем службу.
- name: Install PostgreSQL
  hosts: all
  become: true
  tasks:
    # Устанавливаем пакеты PostgreSQL.
    - name: Install PostgreSQL
      ansible.builtin.apt:
        name:
          - postgresql
          - postgresql-contrib
        state: present
        update_cache: true
    # Включаем автозапуск и запускаем службу.
    - name: Start PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true
