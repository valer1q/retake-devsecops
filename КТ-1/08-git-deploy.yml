# Клонируем приложение из Git-репозитория.
- name: Deploy application
  hosts: web
  become: true
  vars:
    repository_url: https://github.com/valer1q/prilojeniye.git
    application_dir: /opt/example-app
  tasks:
    # Устанавливаем Git.
    - name: Install Git
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: true
    # Клонируем или обновляем приложение.
    - name: Clone repository
      ansible.builtin.git:
        repo: "{{ repository_url }}"
        dest: "{{ application_dir }}"
        version: main
        update: true
    # Публикуем главную страницу приложения через Nginx.
    - name: Publish application page
      ansible.builtin.copy:
        src: "{{ application_dir }}/index.html"
        dest: /var/www/html/index.html
        remote_src: true
        owner: www-data
        group: www-data
        mode: '0644'
