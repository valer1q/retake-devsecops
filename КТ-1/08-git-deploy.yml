---
# Сценарий 8. Деплой приложения из репозитория Git
# Запуск: ansible-playbook 08-git-deploy.yml
# Сайт будет доступен по адресу http://IP-сервера/app/

- name: Деплой сайта из Git-репозитория
  hosts: NGINX
  become: yes

  vars:
    # Адрес репозитория с приложением (простой статический сайт)
    repo_url: https://github.com/mdn/beginner-html-site-styled.git
    # Куда разворачивать приложение
    app_dir: /var/www/html/app

  tasks:

    # Устанавливаем git для клонирования и nginx для раздачи сайта
    - name: Установить git и nginx
      apt:
        name:
          - git
          - nginx
        state: present
        update_cache: yes

    # Клонируем репозиторий. При повторном запуске скачиваются новые изменения.
    # force: yes - локальные изменения на сервере будут перезаписаны
    - name: Клонировать репозиторий
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes

    # Убеждаемся, что nginx запущен и стоит в автозапуске
    - name: Запустить nginx
      service:
        name: nginx
        state: started
        enabled: yes
