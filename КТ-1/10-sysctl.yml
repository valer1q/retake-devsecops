# Настраиваем параметры ядра через sysctl.
- name: Configure sysctl
  hosts: all
  become: true
  tasks:
    # Применяем параметры сетевой безопасности.
    - name: Set kernel parameters
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        sysctl_set: true
        reload: true
      loop:
        - { name: net.ipv4.ip_forward, value: '0' }
        - { name: net.ipv4.conf.all.accept_redirects, value: '0' }
