# Устанавливаем UFW и задаём правила доступа.
- name: Configure firewall
  hosts: all
  become: true
  tasks:
    # Устанавливаем пакет UFW.
    - name: Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true
    # Разрешаем SSH.
    - name: Allow SSH
      community.general.ufw:
        rule: allow
        name: OpenSSH
    # Разрешаем HTTP.
    - name: Allow HTTP
      community.general.ufw:
        rule: allow
        port: '80'
        proto: tcp
    # Включаем файрвол с запретом входящих соединений по умолчанию.
    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming
